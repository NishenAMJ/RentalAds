name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A newer push to the same branch makes the older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # reads the pnpm version from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate             # the Prisma client is not generated by install
      - run: pnpm --filter api run typecheck
      - run: pnpm --filter api run lint:check
      - run: pnpm --filter api test
      - run: pnpm --filter api run test:e2e
      - run: pnpm --filter api build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chrome          # the config defaults to Edge, which GitHub's machines do not have
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()                     # keep the evidence only when something broke
        with:
          name: playwright-results
          path: apps/web/test-results

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      # Throwaway values for a container that disappears with the job; not secrets.
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/ci
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Apply every migration to an empty database, then fail if the result differs from schema.prisma.
      - run: pnpm --filter db exec prisma migrate deploy
      - run: pnpm --filter db exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
