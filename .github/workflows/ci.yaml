name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # reads the pnpm version from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ...the same checkout / pnpm / node / install / db:generate steps as above...
      - run: pnpm --filter web run typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build

    browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chrome      # your config defaults to Edge, which GitHub doesn't have
    steps:
      # ...same setup steps...
      - run: pnpm --filter web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()                 # only keep evidence when something broke
        with:
          name: playwright-results
          path: apps/web/test-results
    

